services:
  api:
    build: { context: ., dockerfile: infra/Dockerfile.api }
    environment:
      - HV_TOKEN_SECRET=${HV_TOKEN_SECRET:?set a token secret}
      - HV_MONTHLY_BUDGET_USD=5000
    ports: ["8080:8080"]
    depends_on: [queue-worker, minio]
  queue-worker:
    build: { context: ., dockerfile: infra/Dockerfile.worker }
    environment:
      - HV_PROVIDER_PRIMARY=mock
      - HV_PROVIDER_SECONDARY=mock
      - HV_COST_CAP_PER_SHOT_USD=5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
  frontend:
    build: { context: ., dockerfile: infra/Dockerfile.frontend }
    ports: ["8081:80"]
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?}
    volumes: ["artifacts:/data"]
  lifecycle-sweeper:
    build: { context: ., dockerfile: infra/Dockerfile.worker }
    command: ["bun", "packages/api/src/index.ts", "--sweep-30d"]
volumes:
  artifacts: {}
