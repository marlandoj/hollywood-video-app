global:
  scrape_interval: 15s
  scrape_timeout: 3s
  evaluation_interval: 30s
scrape_configs:
  - job_name: studio
    honor_labels: true
    sample_limit: 20000
    body_size_limit: 16MB
    static_configs:
      - targets: [127.0.0.1:15464]
  - job_name: collector
    sample_limit: 10000
    static_configs:
      - targets: [127.0.0.1:15888]
  - job_name: jaeger
    sample_limit: 10000
    static_configs:
      - targets: [127.0.0.1:15889]
