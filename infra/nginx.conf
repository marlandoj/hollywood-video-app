# The browser talks to one origin. nginx serves the static app and proxies the
# API and signed artifact paths to the api service, so the frontend never needs
# to be told where the API lives and playback needs no cookie. The hop to the
# api service is mTLS: this proxy presents the only client certificate the API
# accepts, and it verifies the API's certificate against the internal CA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    proxy_pass https://api:8443/health;
    include /etc/nginx/proxy-api.conf;
  }

  location /api/ {
    proxy_pass https://api:8443;
    include /etc/nginx/proxy-api.conf;
  }

  location /artifacts/ {
    proxy_pass https://api:8443;
    include /etc/nginx/proxy-api.conf;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
