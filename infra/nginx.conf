# The browser talks to one origin. nginx serves the static app and proxies the
# API and artifact paths to the api service, so playback cookies stay same-site
# and the frontend never needs to be told where the API lives.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    proxy_pass http://api:8080/health;
    include /etc/nginx/proxy-api.conf;
  }

  location /api/ {
    proxy_pass http://api:8080;
    include /etc/nginx/proxy-api.conf;
  }

  location /artifacts/ {
    proxy_pass http://api:8080;
    include /etc/nginx/proxy-api.conf;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
