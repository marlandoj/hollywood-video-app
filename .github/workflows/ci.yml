name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: lint
        run: bunx oxlint packages scripts || true
      - name: typecheck
        run: bunx tsc --noEmit
      - name: unit + integration
        run: bun test packages test
      - name: build
        run: bun build packages/api/src/index.ts --target=bun --outdir=dist
  benchmark-gate:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: detect model/provider change
        id: detect
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha || 'HEAD~1' }} HEAD | grep -E 'packages/(generator|benchmarks)/' ; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: run benchmark and block on >5% regression
        if: steps.detect.outputs.changed == 'true'
        run: |
          bun packages/benchmarks/src/run.ts /tmp/candidate.json
          bun scripts/benchmark/compare.ts packages/benchmarks/baseline.json /tmp/candidate.json
