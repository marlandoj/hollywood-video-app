name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # A working-tree `git diff --check` is vacuous on a clean checkout: it can
      # only pass. Check the committed range instead, which is what a reviewer
      # actually inspects.
      - name: whitespace check over the committed range
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1)"; fi
          git diff --check "$base" HEAD
      - name: lint
        run: bun run lint
      - name: typecheck
        run: bun run typecheck
      - name: unit + integration
        run: bun test packages test
      - name: build
        run: bun run build
      - name: private staging smoke
        run: bun run smoke:runtime
      - name: compose validation and image build
        env:
          HV_TOKEN_SECRET: ci-validation-secret-that-is-at-least-thirty-two-characters
        run: |
          ./infra/mtls/gen-certs.sh
          docker compose config --quiet
          docker compose build api queue-worker frontend
          # The build context excludes infra/mtls/certs and every private key;
          # a runtime image must contain neither the CA key nor any identity.
          for service in api queue-worker; do
            docker compose run --rm --no-deps --entrypoint sh "$service" -c '
              test ! -e /app/infra/mtls/certs || { echo "cert directory baked into image" >&2; exit 1; }
              baked="$(find /app -type f \( -name "*.key" -o -name "*.pem" -o -name "*.p12" \) -not -path "*/node_modules/*")"
              [ -z "$baked" ] || { echo "key material baked into image: $baked" >&2; exit 1; }
            '
          done
      - name: compose health smoke
        env:
          HV_TOKEN_SECRET: ci-validation-secret-that-is-at-least-thirty-two-characters
        run: |
          docker compose up -d api queue-worker frontend
          # The API port is not published on the host and the hop from the
          # proxy is mTLS, so the only reachable path is the frontend origin.
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8081/health
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 -X POST http://127.0.0.1:8081/api/projects
          if curl --silent --max-time 3 http://127.0.0.1:8080/health; then
            echo "API port must not be published on the host" >&2; exit 1
          fi
          # The API refuses a connection that carries no client certificate.
          if docker compose exec -T frontend sh -c 'wget -q -O- --no-check-certificate https://api:8443/health'; then
            echo "API accepted a connection without a client certificate" >&2; exit 1
          fi
          # Each runtime container holds exactly its own identity plus the CA
          # certificate. The CA signing key never leaves the host and neither
          # container sees the other's private key.
          api_mtls="$(docker compose exec -T api sh -c 'ls -A /run/mtls | sort | xargs')"
          if [ "$api_mtls" != "api.crt api.key ca.crt" ]; then
            echo "api container mTLS mount is not least-privilege: $api_mtls" >&2; exit 1
          fi
          frontend_mtls="$(docker compose exec -T frontend sh -c 'ls -A /etc/nginx/mtls | sort | xargs')"
          if [ "$frontend_mtls" != "ca.crt frontend.crt frontend.key" ]; then
            echo "frontend container mTLS mount is not least-privilege: $frontend_mtls" >&2; exit 1
          fi
          if docker compose exec -T api sh -c 'test -e /run/mtls/ca.key' || docker compose exec -T frontend sh -c 'test -e /etc/nginx/mtls/ca.key'; then
            echo "CA signing key is mounted into a runtime container" >&2; exit 1
          fi
      - name: compose cleanup
        if: always()
        env:
          HV_TOKEN_SECRET: ci-validation-secret-that-is-at-least-thirty-two-characters
        run: docker compose down --volumes --remove-orphans
  benchmark-gate:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          # The latency gate checks the merge base out into a worktree and runs
          # it on this same runner, so the full history has to be present.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Runs on every pull request and push: deterministic metrics against the
      # committed baseline, latency as an interleaved same-host A/B against the
      # merge base (AC-002, 5% on every metric).
      - name: benchmark gate
        env:
          HV_BENCHMARK_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bun run benchmark:compare
