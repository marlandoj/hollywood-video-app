name: ci
on:
  push:
    branches: [main]
    # G4, approved by Kevin 2026-09-30: loop record commits touch only these paths, and no test
    # reads them. docs/evidence/** is read by tests, so it is deliberately not ignored.
    paths-ignore: ['docs/loop/**', 'docs/PROGRAM-EXECUTION.md']
  pull_request:

# A new push to a PR branch cancels the older run for that branch, so rapid
# iteration doesn't stack 3-4h runs. Main-branch runs are never cancelled —
# every merge to main still gets a full verification.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  graphics-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hv_admin
          POSTGRES_PASSWORD: ci-admin-fixture-only
          POSTGRES_DB: hollywood_video_test
        ports: ["127.0.0.1:55432:5432"]
        options: >-
          --health-cmd "pg_isready -U hv_admin -d hollywood_video_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      objects:
        image: rustfs/rustfs:1.0.0-rc.5
        env:
          RUSTFS_ACCESS_KEY: ci-storage-fixture
          RUSTFS_SECRET_KEY: ci-storage-fixture-secret-only
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_OBS_LOGGER_LEVEL: error
        ports: ["127.0.0.1:59000:9000"]
    env:
      HV_PG_ADMIN_URL: postgres://hv_admin:ci-admin-fixture-only@127.0.0.1:55432/hollywood_video_test
      HV_API_DATABASE_URL: postgres://hv_api:ci-api-fixture-only@127.0.0.1:55432/hollywood_video_test
      HV_WORKER_DATABASE_URL: postgres://hv_worker:ci-worker-fixture-only@127.0.0.1:55432/hollywood_video_test
      HV_S3_ENDPOINT: http://127.0.0.1:59000
      HV_S3_BUCKET: rough-cut-ci
      HV_S3_FLEET_TEST_BUCKET: rough-cut-fleet-test-ci
      HV_S3_BACKUP_TEST_BUCKET: rough-cut-backup-test-ci
      HV_PG_BIN: /usr/lib/postgresql/16/bin
      HV_S3_REGION: us-east-1
      HV_S3_ACCESS_KEY_ID: ci-storage-fixture
      HV_S3_SECRET_ACCESS_KEY: ci-storage-fixture-secret-only
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: install graphics system libraries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libgtk-3-0 libasound2t64
      - name: install pinned graphics browser
        run: |
          browser=$(bun scripts/install-graphics-runtime.ts "$RUNNER_TEMP/graphics-chrome")
          echo "HV_GRAPHICS_CHROME_PATH=$browser" >> "$GITHUB_ENV"
      - name: PostgreSQL test roles
        run: bun scripts/storage-ci-roles.ts
      - name: independent private graphic buckets
        run: |
          python3 -m venv "$RUNNER_TEMP/storage-sdk"
          "$RUNNER_TEMP/storage-sdk/bin/pip" install boto3==1.42.89
          "$RUNNER_TEMP/storage-sdk/bin/python" scripts/prepare-object-bucket.py
          HV_S3_BUCKET="$HV_S3_FLEET_TEST_BUCKET" "$RUNNER_TEMP/storage-sdk/bin/python" scripts/prepare-object-bucket.py
      - name: real graphics, owner API, PostgreSQL checkpoint and independent archive contracts
        run: bun test packages/generator/test/motion-graphics.test.ts packages/generator/test/edit-graphic-sources.test.ts packages/api/test/graphics.test.ts packages/storage/test/graphics.test.ts packages/storage/test/assembly-projects.test.ts packages/storage/test/assembly-renders.test.ts packages/storage/test/living-script-projects.test.ts packages/storage/test/living-script-acceptance-projects.test.ts packages/storage/test/living-script-job-projects.test.ts packages/storage/test/execution-capture-projects.test.ts packages/storage/test/current-screenplay-projects.test.ts packages/storage/test/current-film-worker.test.ts packages/storage/test/current-film-source-projects.test.ts
  telemetry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: install pinned telemetry backends
        run: python3 scripts/install-observability-runtime.py --root "$RUNNER_TEMP/telemetry-binaries"
      - name: stored trace and metric API contract
        env:
          HV_TELEMETRY_CONTRACT_CI: "1"
        run: bun scripts/telemetry-explorer-smoke.ts "$RUNNER_TEMP/telemetry-binaries"
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # hang guard; the suite itself runs in `tests`
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hv_admin
          POSTGRES_PASSWORD: ci-admin-fixture-only
          POSTGRES_DB: hollywood_video_test
        ports: ["127.0.0.1:55432:5432"]
        options: >-
          --health-cmd "pg_isready -U hv_admin -d hollywood_video_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      objects:
        image: rustfs/rustfs:1.0.0-rc.5
        env:
          RUSTFS_ACCESS_KEY: ci-storage-fixture
          RUSTFS_SECRET_KEY: ci-storage-fixture-secret-only
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_OBS_LOGGER_LEVEL: error
        ports: ["127.0.0.1:59000:9000"]
    env:
      HV_PG_ADMIN_URL: postgres://hv_admin:ci-admin-fixture-only@127.0.0.1:55432/hollywood_video_test
      HV_API_DATABASE_URL: postgres://hv_api:ci-api-fixture-only@127.0.0.1:55432/hollywood_video_test
      HV_WORKER_DATABASE_URL: postgres://hv_worker:ci-worker-fixture-only@127.0.0.1:55432/hollywood_video_test
      HV_S3_ENDPOINT: http://127.0.0.1:59000
      HV_S3_BUCKET: rough-cut-ci
      HV_S3_FLEET_TEST_BUCKET: rough-cut-fleet-test-ci
      HV_S3_BACKUP_TEST_BUCKET: rough-cut-backup-test-ci
      HV_PG_BIN: /usr/lib/postgresql/16/bin
      HV_S3_REGION: us-east-1
      HV_S3_ACCESS_KEY_ID: ci-storage-fixture
      HV_S3_SECRET_ACCESS_KEY: ci-storage-fixture-secret-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: install ffmpeg
        # The package mirror has hung this step for over an hour (HV-016-36). Bound each attempt
        # and retry, so a stalled mirror costs minutes, not the job's whole timeout.
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 600 sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core; then exit 0; fi
            echo "apt attempt $attempt failed or stalled; retrying" >&2
            sleep 15
          done
          exit 1
      # A working-tree `git diff --check` is vacuous on a clean checkout: it can
      # only pass. Check the committed range instead, which is what a reviewer
      # actually inspects.
      - name: whitespace check over the committed range
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1)"; fi
          git diff --check "$base" HEAD
      - name: lint
        run: bun run lint
      - name: typecheck
        run: bun run typecheck
      - name: PostgreSQL test roles
        run: bun scripts/storage-ci-roles.ts
      - name: private S3 test bucket
        run: |
          python3 -m venv "$RUNNER_TEMP/storage-sdk"
          "$RUNNER_TEMP/storage-sdk/bin/pip" install boto3==1.42.89
          "$RUNNER_TEMP/storage-sdk/bin/python" scripts/prepare-object-bucket.py
          HV_S3_BUCKET="$HV_S3_BACKUP_TEST_BUCKET" "$RUNNER_TEMP/storage-sdk/bin/python" scripts/prepare-object-bucket.py
          HV_S3_BUCKET="$HV_S3_FLEET_TEST_BUCKET" "$RUNNER_TEMP/storage-sdk/bin/python" scripts/prepare-object-bucket.py
          "$HV_PG_BIN/pg_dump" --version
          "$HV_PG_BIN/pg_restore" --version
      - name: portable archive validation
        run: python3 -m unittest discover -s scripts -p "test_archive_package.py" -v
      - name: storage bootstrap configuration
        run: python3 -m unittest discover -s scripts -p "test_storage_bootstrap.py" -v
      - name: managed storage startup configuration
        run: python3 -m unittest discover -s scripts -p "test_storage_runtime.py" -v
      - name: storage cutover failure boundaries
        run: python3 -m unittest discover -s scripts -p "test_storage_deployment.py" -v
      - name: observability runtime integrity
        run: python3 -m unittest discover -s scripts -p "test_observability_runtime.py" -v
      # The unit + integration suite runs in the `tests` jobs below, split into shards. This step
      # proves the shards hold every file `bun test packages test` would run, each exactly once.
      - name: test shards cover the whole suite
        run: bun scripts/ci/test-shards.ts check 4
      - name: native subject input interoperability
        run: |
          python3 -m venv "$RUNNER_TEMP/motion-sdk"
          "$RUNNER_TEMP/motion-sdk/bin/pip" install numpy==2.4.3
          HV_NUMPY_PYTHON="$RUNNER_TEMP/motion-sdk/bin/python" bun scripts/subject-motion-smoke.ts
      - name: three-worker PostgreSQL and S3 flow
        run: bun scripts/storage-fleet-smoke.ts
      - name: rich animatic invariants
        run: bun run benchmark:animatic
      - name: build
        run: bun run build
      - name: private staging smoke
        run: bun run smoke:runtime
      - name: compose validation and image build
        env:
          HV_TOKEN_SECRET: ci-validation-secret-that-is-at-least-thirty-two-characters
        run: |
          ./infra/mtls/gen-certs.sh
          docker compose config --quiet
          docker compose build api queue-worker frontend
          # The build context excludes infra/mtls/certs and every private key;
          # a runtime image must contain neither the CA key nor any identity.
          for service in api queue-worker; do
            docker compose run --rm --no-deps --entrypoint sh "$service" -c '
              test ! -e /app/infra/mtls/certs || { echo "cert directory baked into image" >&2; exit 1; }
              baked="$(find /app -type f \( -name "*.key" -o -name "*.pem" -o -name "*.p12" \) -not -path "*/node_modules/*")"
              [ -z "$baked" ] || { echo "key material baked into image: $baked" >&2; exit 1; }
            '
          done
      - name: compose health smoke
        env:
          HV_TOKEN_SECRET: ci-validation-secret-that-is-at-least-thirty-two-characters
        run: |
          docker compose up -d api queue-worker frontend
          # The API port is not published on the host and the hop from the
          # proxy is mTLS, so the only reachable path is the frontend origin.
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8081/health
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 -X POST http://127.0.0.1:8081/api/projects
          bun scripts/reference-proxy-smoke.ts http://127.0.0.1:8081
          if curl --silent --max-time 3 http://127.0.0.1:8080/health; then
            echo "API port must not be published on the host" >&2; exit 1
          fi
          # The API refuses a connection that carries no client certificate.
          if docker compose exec -T frontend sh -c 'wget -q -O- --no-check-certificate https://api:8443/health'; then
            echo "API accepted a connection without a client certificate" >&2; exit 1
          fi
          # Each runtime container holds exactly its own identity plus the CA
          # certificate. The CA signing key never leaves the host and neither
          # container sees the other's private key.
          api_mtls="$(docker compose exec -T api sh -c 'ls -A /run/mtls | sort | xargs')"
          if [ "$api_mtls" != "api.crt api.key ca.crt" ]; then
            echo "api container mTLS mount is not least-privilege: $api_mtls" >&2; exit 1
          fi
          frontend_mtls="$(docker compose exec -T frontend sh -c 'ls -A /etc/nginx/mtls | sort | xargs')"
          if [ "$frontend_mtls" != "ca.crt frontend.crt frontend.key" ]; then
            echo "frontend container mTLS mount is not least-privilege: $frontend_mtls" >&2; exit 1
          fi
          if docker compose exec -T api sh -c 'test -e /run/mtls/ca.key' || docker compose exec -T frontend sh -c 'test -e /etc/nginx/mtls/ca.key'; then
            echo "CA signing key is mounted into a runtime container" >&2; exit 1
          fi
      - name: compose cleanup
        if: always()
        env:
          HV_TOKEN_SECRET: ci-validation-secret-that-is-at-least-thirty-two-characters
        run: docker compose down --volumes --remove-orphans
  # HV-016-36 (G18): the unit + integration suite, split across parallel jobs. Each shard is a
  # fresh runner with its own PostgreSQL and object store, and runs whole test files with
  # `bun test`. The quality job's `check` step proves the shards cover the suite exactly once.
  # Shard 1 holds the one file that alone takes about 76 minutes; the others take about 45.
  tests:
    name: tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 150 # hang guard; the longest shard takes about 80 minutes
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hv_admin
          POSTGRES_PASSWORD: ci-admin-fixture-only
          POSTGRES_DB: hollywood_video_test
        ports: ["127.0.0.1:55432:5432"]
        options: >-
          --health-cmd "pg_isready -U hv_admin -d hollywood_video_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      objects:
        image: rustfs/rustfs:1.0.0-rc.5
        env:
          RUSTFS_ACCESS_KEY: ci-storage-fixture
          RUSTFS_SECRET_KEY: ci-storage-fixture-secret-only
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_OBS_LOGGER_LEVEL: error
        ports: ["127.0.0.1:59000:9000"]
    env:
      HV_PG_ADMIN_URL: postgres://hv_admin:ci-admin-fixture-only@127.0.0.1:55432/hollywood_video_test
      HV_API_DATABASE_URL: postgres://hv_api:ci-api-fixture-only@127.0.0.1:55432/hollywood_video_test
      HV_WORKER_DATABASE_URL: postgres://hv_worker:ci-worker-fixture-only@127.0.0.1:55432/hollywood_video_test
      HV_S3_ENDPOINT: http://127.0.0.1:59000
      HV_S3_BUCKET: rough-cut-ci
      HV_S3_FLEET_TEST_BUCKET: rough-cut-fleet-test-ci
      HV_S3_BACKUP_TEST_BUCKET: rough-cut-backup-test-ci
      HV_PG_BIN: /usr/lib/postgresql/16/bin
      HV_S3_REGION: us-east-1
      HV_S3_ACCESS_KEY_ID: ci-storage-fixture
      HV_S3_SECRET_ACCESS_KEY: ci-storage-fixture-secret-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # as quality had it: some suites read history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: install ffmpeg
        # The package mirror has hung this step for over an hour (HV-016-36). Bound each attempt
        # and retry, so a stalled mirror costs minutes, not the job's whole timeout.
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 600 sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core; then exit 0; fi
            echo "apt attempt $attempt failed or stalled; retrying" >&2
            sleep 15
          done
          exit 1
      - name: PostgreSQL test roles
        run: bun scripts/storage-ci-roles.ts
      - name: private S3 test buckets
        run: |
          python3 -m venv "$RUNNER_TEMP/storage-sdk"
          "$RUNNER_TEMP/storage-sdk/bin/pip" install boto3==1.42.89
          "$RUNNER_TEMP/storage-sdk/bin/python" scripts/prepare-object-bucket.py
          HV_S3_BUCKET="$HV_S3_BACKUP_TEST_BUCKET" "$RUNNER_TEMP/storage-sdk/bin/python" scripts/prepare-object-bucket.py
          HV_S3_BUCKET="$HV_S3_FLEET_TEST_BUCKET" "$RUNNER_TEMP/storage-sdk/bin/python" scripts/prepare-object-bucket.py
          "$HV_PG_BIN/pg_dump" --version
          "$HV_PG_BIN/pg_restore" --version
      - name: unit + integration, shard ${{ matrix.shard }} of 4
        run: |
          bun scripts/ci/test-shards.ts list ${{ matrix.shard }} 4 > "$RUNNER_TEMP/shard-files"
          mapfile -t files < "$RUNNER_TEMP/shard-files"
          echo "shard ${{ matrix.shard }} of 4: ${#files[@]} test files"
          bun test "${files[@]}"
  benchmark-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180 # hang guard
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          # The latency gate checks the merge base out into a worktree and runs
          # it on this same runner, so the full history has to be present.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: install ffmpeg
        # The package mirror has hung this step for over an hour (HV-016-36). Bound each attempt
        # and retry, so a stalled mirror costs minutes, not the job's whole timeout.
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 600 sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core; then exit 0; fi
            echo "apt attempt $attempt failed or stalled; retrying" >&2
            sleep 15
          done
          exit 1
      # Runs on every pull request and push: deterministic metrics against the
      # committed baseline, latency as an interleaved same-host A/B against the
      # merge base (AC-002, 5% on every metric).
      - name: benchmark gate
        env:
          HV_BENCHMARK_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bun run benchmark:compare
