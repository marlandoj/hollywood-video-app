acceptance_criteria:
  - "[AC-001] The 24-shot benchmark is defined (fixed, versioned Fountain file) and runs end-to-end with baseline metrics recorded: per-shot latency, total pipeline time, visual quality (CLIP/FID or equivalent), continuity, and cost per shot."
  - "[AC-002] CI runs the benchmark on every model/provider change and blocks merge on a regression greater than 5% on any metric."
  - "[AC-003] Name clearance for 'Hollywood Video' (or the pre-cleared fallback) is documented in an ADR."
  - "[AC-004] Anonymous project creation returns a signed 72 h URL token, and the complete core journey finishes with no account, email, or card."
  - "[AC-005] The 9-package monorepo exists and CI is green through lint, typecheck, unit, integration, and build stages."
  - "[AC-006] The Fountain editor and parser pass the conformance suite, including protected text, 30-page rejection, 20-scene warning, and unparseable-construct flagging, with per-edit version history."
  - "[AC-007] The creative bible auto-generates per project, rights attestation is captured, and every export carries C2PA-style credentials plus the downloadable provenance manifest."
  - "[AC-008] A 12-shot short is produced end-to-end (script to MP4) with fewer than 2 continuity failures."
  - "[AC-009] All provider submissions pass the safety gate; the prohibited-prompt battery is 100% blocked with a polite refusal and zero provider calls."
  - "[AC-010] The per-job cost cap (default $5/shot) cancels over-cap jobs and notifies the user; every job records provider, model, prompt_tokens, output_frames, gpu_seconds, and total_cost_usd with rollups."
  - "[AC-011] Capacity tiers are enforced (free: 1 concurrent / 24 shots / 720p; elevated: 3 / 60 / 1080p) and auto-throttle is verified at 80% (queue behind) and 100% (reject with capacity message)."
  - "[AC-012] The continuity check flags below-threshold shots to the operator review queue; the repair loop retries at most twice, then marks the shot 'degraded' with a metadata note in the final MP4."
  - "[AC-013] Auto-assembly (script order, 0.5 s crossfades, optional subtitles), the HLS viewer, and export (H.264 1080p 30 fps AAC, 30-day link) work; every export passes ffprobe and re-export is byte-identical."
  - "[AC-014] Alpha TTS voiceover from dialogue lines and SRT/VTT captions (burned in or sidecar) are present on exports."
  - "[AC-015] Accountless review links support read-only and approve/deny permissions, expire after 7 days or 3 views, and are revocable by the creator."
  - "[AC-016] The public status page, operator console, support form, and anonymized analytics are live; no PII on any public surface; IPs delete after 30 days; no cookies or tracking pixels."
  - "[AC-017] ToS and the content policy (four prohibitions) are live and counsel-reviewed; takedown completes within 24 h of a verified request and is logged and irreversible."
  - "[AC-018] Free public beta completes: 100 invited users over 2 weeks with completion rate >= 70%, median time-to-MP4 < 12 min, monthly cost < $5,000, and uptime >= 99%."
  - "[AC-019] The load test passes (50 concurrent projects, 500 queued shots, p99 < 120 s), the pen test has no open critical or high findings, and the GA launch is live (public URL, status page, announcement, published benchmark results)."
  - "[AC-020] Post-launch cadence is operational: weekly cost review, monthly benchmark re-run, quarterly capacity planning."
  - "[AC-021] The public site sustains >= 99% monthly uptime during the beta window."
  - "[AC-022] The public UI meets WCAG 2.1 AA (all interactive elements keyboard-navigable) and every exported video carries captions."
  - "[AC-023] The full stack runs via a single docker compose up on a 4xA100 machine with no cloud-specific dependencies."
  - "[AC-024] Durable, idempotent jobs survive worker restart via frame-boundary checkpoints; every job carries a retry policy, timeout, and cost tracker."
  - "[AC-025] Under mixed load, no anonymous project starves another (weighted fair share of GPU time)."
  - "[AC-026] Provider failover: a primary provider timeout or error retries on the configured secondary before the job fails."
  - "[AC-027] Revision history: each edit creates a version and regeneration can target any prior version."
  - "[AC-028] Anonymous projects and artifacts auto-delete after 30 days (S3 lifecycle); operator extensions are logged."
  - "[AC-029] Five external users each produce a 60-second MP4 without operator intervention (M3 gate)."
